name: Asset inventory runtime evidence
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/asset-inventory.yml'
      - 'tools/asset_pipeline/runtime/**'
      - 'docs/qa/verify_runtime_inventory.py'
      - 'tools/asset_pipeline/live_catalog.py'
      - 'tools/asset_pipeline/runtime_catalog_evidence.py'
      - 'tests/test_live_catalog.py'
      - 'assets/**'
      - 'scripts/**'
      - 'scenes/**'
      - 'project.godot'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    env:
      FRONTLINE_INVENTORY_DIR: ${{ github.workspace }}/qa-inventory
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify static baseline and manifest
        run: |
          python3 docs/qa/verify_asset_inventory.py
          node tools/asset_pipeline/build_manifest.mjs
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: false
      - name: Import actual tracked game assets
        run: |
          set -o pipefail
          mkdir -p "$FRONTLINE_INVENTORY_DIR"
          timeout 120s godot --headless --editor --import --path . 2>&1 | tee "$FRONTLINE_INVENTORY_DIR/import.log"
          if grep -E 'SCRIPT ERROR:|Parse Error' "$FRONTLINE_INVENTORY_DIR/import.log"; then exit 1; fi
      - name: Inventory actual instantiated scenes and render evidence
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/frontline-inventory-profile
        run: |
          set -o pipefail
          timeout 180s xvfb-run -a -s '-screen 0 1280x720x24' godot --path . --rendering-driver opengl3 --script res://tools/asset_pipeline/runtime/inventory_qa.gd 2>&1 | tee "$FRONTLINE_INVENTORY_DIR/runtime.log"
          grep -q ASSET_RUNTIME_INVENTORY_PASS "$FRONTLINE_INVENTORY_DIR/runtime.log"
          if grep -E 'SCRIPT ERROR:|Parse Error|ASSET_RUNTIME_ERROR' "$FRONTLINE_INVENTORY_DIR/runtime.log"; then exit 1; fi
          python3 docs/qa/verify_runtime_inventory.py "$FRONTLINE_INVENTORY_DIR/runtime_inventory.json" "$FRONTLINE_INVENTORY_DIR/reconciliation.json"
          for image in map_briefing fps_rifle_ads enemy_rifle enemy_experimental; do test -s "$FRONTLINE_INVENTORY_DIR/$image.png"; done
      - name: Discover current assets and reconcile engine observations
        run: |
          python3 -m unittest discover -s tests -p 'test_live_catalog.py' -v
          python3 tools/asset_pipeline/live_catalog.py --runtime "$FRONTLINE_INVENTORY_DIR/runtime_inventory.json" --output "$FRONTLINE_INVENTORY_DIR/live_catalog.json"
          python3 tools/asset_pipeline/live_catalog.py --runtime "$FRONTLINE_INVENTORY_DIR/runtime_inventory.json" --output "$RUNNER_TEMP/live_catalog_repeat.json"
          cmp "$FRONTLINE_INVENTORY_DIR/live_catalog.json" "$RUNNER_TEMP/live_catalog_repeat.json"
          python3 -c 'import json,sys; c=json.load(open(sys.argv[1])); assert len(c["dynamic_resolution"])==4 and all(r["status"]=="finite_domain_probed" for r in c["dynamic_resolution"]); assert sum(len(r["candidates"]) for r in c["dynamic_resolution"])==48; assert c["geometry_index"] and len(c["runtime_compositions"])==c["runtime"]["samples"]; assert len(c["registered_world_lods"])==23 and sum(a["family"]=="light_post" for a in c["registered_world_lods"])==4 and all(len(a["levels"])==3 for a in c["registered_world_lods"]); print("RUNTIME_CATALOG_COVERAGE_PASS", len(c["geometry_index"]),len(c["runtime_compositions"]))' "$FRONTLINE_INVENTORY_DIR/live_catalog.json"
      - name: Upload evidence including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Frontline-Runtime-Inventory-${{ github.sha }}
          path: qa-inventory/
          if-no-files-found: warn
          retention-days: 30
