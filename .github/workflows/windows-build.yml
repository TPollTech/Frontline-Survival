name: Windows playable build

on:
  push:
    branches: [main]
    tags: ["v*"] # release versions; not filtered by paths
    paths:
      - ".github/workflows/windows-build.yml"
      - "scripts/**"
      - "scenes/**"
      - "assets/**"
      - "tools/**"
      - "tests/**"
      - "project.godot"
      - "export_presets.cfg"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # Manual releases are not canceled by unrelated pushes to main.
  group: windows-build-${{ github.event_name == 'workflow_dispatch' && 'manual-release' || github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - name: Checkout game sources
        uses: actions/checkout@v4

      - name: Detect new numbered release (skip if already published)
        id: release_gate
        # Auto-publish only when the version has NOT been released. Existing
        # tags skip export/package, limiting GitHub Actions consumption.
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^application\/product_version="\([^"]*\)"/\1/p' export_presets.cfg | head -n 1)"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid product version in export_presets.cfg: $VERSION"
            exit 1
          fi
          TAG="v$VERSION"
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" != "$TAG" ]]; then
            echo "::error::Requested tag ${GITHUB_REF_NAME} differs from project version $TAG"
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "create_release=false" >> "$GITHUB_OUTPUT"
            echo "Existing $TAG; run tests, skip redundant Windows build and publication."
          else
            echo "create_release=true" >> "$GITHUB_OUTPUT"
            echo "New $TAG; export Windows only after all QA steps succeed."
          fi

      - name: Setup Godot and Windows export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: true

      - name: Verify Godot installation
        run: godot --version

      - name: Setup Python for model generation
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Rebuild original weapon models with corrected normals
        shell: bash
        run: |
          python -m pip install "numpy>=2.0,<2.5" "trimesh==4.11.1" "scipy>=1.11,<1.18" "pillow>=10,<13"
          python tools/build_weapons.py
          python tools/generate_foley_textures.py
          python tools/verify_project.py

      - name: Import assets and parse GDScript
        shell: bash
        run: |
          set -o pipefail
          godot --headless --editor --path . --import 2>&1 | tee godot-import.log
          if grep -E 'SCRIPT ERROR:|ERROR:.*Parse Error|Failed to load script|Parse Error:' godot-import.log; then
            echo 'Godot import detected critical script/resource errors'
            exit 1
          fi

      - name: Smoke test startup in headless mode
        shell: bash
        run: |
          set -o pipefail
          timeout 25s godot --headless --path . --quit-after 120 2>&1 | tee godot-smoke.log
          if grep -E 'SCRIPT ERROR:|ERROR:.*Parse Error|Invalid call\.|Failed to load script' godot-smoke.log; then
            echo 'Godot startup detected a critical scripting error'
            exit 1
          fi

      - name: Deterministic QA - 50 wave compositions and heavy milestones
        shell: bash
        run: |
          set -o pipefail
          timeout 40s godot --headless --path . --script res://tests/wave_rules_qa.gd 2>&1 | tee godot-wave-rules.log
          grep -q 'QA_WAVE_RULES_PASS' godot-wave-rules.log
          if grep -E 'SCRIPT ERROR:|ERROR:.*Parse Error|QA_WAVE_RULES_FAIL|WAVE_RULE_ERROR:' godot-wave-rules.log; then
            echo 'Wave composition regression failed'
            exit 1
          fi

      - name: Core Survival QA - accuracy, challenge payouts and quadkills
        shell: bash
        run: |
          set -o pipefail
          timeout 40s godot --headless --path . --script res://tests/survival_features_qa.gd 2>&1 | tee godot-survival-features.log
          grep -q 'QA_SURVIVAL_FEATURES_PASS' godot-survival-features.log
          if grep -E 'SCRIPT ERROR:|ERROR:.*Parse Error|QA_SURVIVAL_FEATURES_FAIL|SURVIVAL_QA_ERROR:' godot-survival-features.log; then
            echo 'Survival feature regression detected'
            exit 1
          fi

      - name: Integration QA - 100 spawns and two full waves
        shell: bash
        run: |
          set -o pipefail
          timeout 55s godot --headless --path . --script res://tests/runtime_wave_qa.gd 2>&1 | tee godot-integration.log
          grep -q 'QA_RUNTIME_PASS' godot-integration.log
          if grep -E 'SCRIPT ERROR:|ERROR:.*Parse Error|QA_RUNTIME_FAIL' godot-integration.log; then
            echo 'Integration scenario failed'
            exit 1
          fi

      - name: Rendered humanoid QA - actual GLB skinning under Xvfb
        shell: bash
        run: |
          set -o pipefail
          command -v xvfb-run
          timeout 55s xvfb-run -a -s '-screen 0 1280x720x24' \
            godot --path . --rendering-driver opengl3 --script res://tests/humanoid_qa_snapshot.gd 2>&1 | tee godot-humanoid-render.log
          grep -q 'QA_HUMANOID_SNAPSHOT_PASS' godot-humanoid-render.log
          test -s docs/qa/humanoid_current.png

      - name: Upload rendered soldier QA screenshot
        uses: actions/upload-artifact@v4
        with:
          name: Frontline-Humanoid-QA-${{ github.sha }}
          path: docs/qa/humanoid_current.png
          retention-days: 30
          if-no-files-found: error

      - name: Static integrity tests
        run: |
          python tools/verify_project.py

      - name: Export Windows release
        if: steps.release_gate.outputs.create_release == 'true'
        shell: bash
        run: |
          set -o pipefail
          mkdir -p dist
          godot --headless --path . --export-release "Windows Desktop" dist/FrontlineSurvival.exe 2>&1 | tee godot-export.log
          test -s dist/FrontlineSurvival.exe
          test -s dist/FrontlineSurvival.pck || echo 'Export may have embedded resources; inspect logs'
          if grep -E 'SCRIPT ERROR:|ERROR:.*Parse Error|Failed to export|Export failed' godot-export.log; then
            echo 'Godot export reported critical error'
            exit 1
          fi
          cp README.md dist/LEIA-ME.md

      - name: Package standalone ZIP with version
        if: steps.release_gate.outputs.create_release == 'true'
        id: package
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^application\/product_version="\([^"]*\)"/\1/p' export_presets.cfg | head -n 1)"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid application/product_version in export_presets.cfg: $VERSION"
            exit 1
          fi
          TAG="v$VERSION"
          ASSET="FrontlineSurvival-${TAG}-Windows.zip"
          test -s dist/FrontlineSurvival.exe
          test -s dist/FrontlineSurvival.pck
          (cd dist && zip -q -9 "../$ASSET" FrontlineSurvival.exe FrontlineSurvival.pck LEIA-ME.md)
          test -s "$ASSET"
          sha256sum "$ASSET" > "$ASSET.sha256"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "asset=$ASSET" >> "$GITHUB_OUTPUT"
          echo "Created $ASSET and SHA-256"

      - name: Upload temporary workflow artifact
        if: steps.release_gate.outputs.create_release == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: FrontlineSurvival-${{ steps.package.outputs.tag }}-Windows
          path: |
            ${{ steps.package.outputs.asset }}
            ${{ steps.package.outputs.asset }}.sha256
          retention-days: 30
          if-no-files-found: error

      - name: Commit regenerated GLB meshes to GitHub
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        continue-on-error: true
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/models/*.glb assets/textures/weapon_*.png assets/audio/reloads/*.wav docs/qa/humanoid_current.png
          if git diff --cached --quiet; then
            echo "Generated game assets already synchronized."
          else
            git commit -m "assets: synchronize meshes, materials and reload foley [skip ci]"
            # NEVER stash untracked build ZIP/checksum: they must remain in
            # the workspace for the following gh release create step.
            # autoStash handles tracked modifications without hiding artifacts.
            git -c rebase.autoStash=true pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Publish immutable numbered GitHub Release
        if: steps.release_gate.outputs.create_release == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.package.outputs.tag }}
          ASSET: ${{ steps.package.outputs.asset }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists. Keeping its files unchanged; bump application/product_version for the next release."
            exit 0
          fi
          NOTES="docs/releases/${TAG}.md"
          if [ ! -f "$NOTES" ]; then
            NOTES="release-notes.txt"
            printf "Versão de testes para Windows.\n\nExtraia o ZIP completo e execute FrontlineSurvival.exe com o arquivo .pck na mesma pasta.\n\nConsulte docs/CHANGELOG.md e ROADMAP.md para as mudanças e limitações.\n\nBuild validada em Godot CI, mas ainda requer teste visual e de jogabilidade no Windows.\n" > "$NOTES"
          fi
          gh release create "$TAG" "$ASSET" "$ASSET.sha256" \
            --target "$GITHUB_SHA" \
            --title "Frontline Survival ${TAG} — Testes Windows" \
            --notes-file "$NOTES" \
            --prerelease --latest=false
          gh release view "$TAG" --json url,assets --jq '{url: .url, assets: [.assets[].name]}'
          echo "Release $TAG published successfully."
