name: Asset Studio browser QA
on:
  push:
    branches: [main]
    paths:
      - 'tools/asset_studio/**'
      - 'tools/asset_pipeline/live_catalog.py'
      - 'tools/asset_pipeline/runtime/**'
      - 'tests/test_live_catalog.py'
      - 'assets/**'
      - 'scenes/**'
      - 'scripts/**'
      - '.github/workflows/asset-studio.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned Studio dependencies
        working-directory: tools/asset_studio
        run: |
          npm install --ignore-scripts
          npx playwright install --with-deps chromium
      - name: Verify catalog and stage actual assets
        run: |
          python -m unittest discover -s tests -p 'test_live_catalog.py' -v
          python tools/asset_studio/prepare.py "$RUNNER_TEMP/studio"
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: false
      - name: Render actual Godot scene views
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/frontline-views-profile
          FRONTLINE_VIEWS_DIR: ${{ runner.temp }}/godot-views
        run: |
          set -o pipefail
          mkdir -p "$FRONTLINE_VIEWS_DIR"
          timeout 120s godot --headless --editor --import --path . 2>&1 | tee "$FRONTLINE_VIEWS_DIR/import.log"
          if grep -E 'SCRIPT ERROR:|Parse Error' "$FRONTLINE_VIEWS_DIR/import.log"; then exit 1; fi
          timeout 120s xvfb-run -a -s '-screen 0 1280x720x24' godot --path . --rendering-driver opengl3 --script res://tools/asset_pipeline/runtime/capture_views.gd 2>&1 | tee "$FRONTLINE_VIEWS_DIR/render.log"
          grep -q RUNTIME_VIEWS_PASS "$FRONTLINE_VIEWS_DIR/render.log"
          if grep -E 'SCRIPT ERROR:|Parse Error|RUNTIME_VIEW_FAIL' "$FRONTLINE_VIEWS_DIR/render.log"; then exit 1; fi
          inventory="$RUNNER_TEMP/studio-runtime-inventory"
          mkdir -p "$inventory"
          FRONTLINE_INVENTORY_DIR="$inventory" XDG_DATA_HOME="$RUNNER_TEMP/studio-inventory-profile" timeout 180s xvfb-run -a -s '-screen 0 1280x720x24' godot --path . --rendering-driver opengl3 --script res://tools/asset_pipeline/runtime/inventory_qa.gd 2>&1 | tee "$inventory/runtime.log"
          grep -q ASSET_RUNTIME_INVENTORY_PASS "$inventory/runtime.log"
          if grep -E 'SCRIPT ERROR:|Parse Error|ASSET_RUNTIME_ERROR' "$inventory/runtime.log"; then exit 1; fi
          python docs/qa/verify_runtime_inventory.py "$inventory/runtime_inventory.json" "$inventory/reconciliation.json"
          rm -rf "$RUNNER_TEMP/studio"
          python tools/asset_studio/prepare.py "$RUNNER_TEMP/studio" --runtime "$inventory/runtime_inventory.json"
          python tools/asset_studio/attach_runtime_views.py "$RUNNER_TEMP/studio" "$FRONTLINE_VIEWS_DIR"
      - name: Browser GLB loading and navigation
        run: |
          python -m http.server 8765 --bind 127.0.0.1 --directory "$RUNNER_TEMP/studio" > "$RUNNER_TEMP/studio-server.log" 2>&1 &
          server=$!
          trap 'kill "$server" || true' EXIT
          for n in $(seq 1 30); do curl -fsS http://127.0.0.1:8765/live_catalog.json >/dev/null && break; sleep 1; done
          REQUIRE_RUNTIME_VIEWS=1 STUDIO_EVIDENCE="$RUNNER_TEMP/studio-evidence" node tools/asset_studio/browser_test.mjs
      - name: Prepare offline Studio archive
        run: |
          python - <<'PY'
          import os, pathlib, zipfile, hashlib
          base=pathlib.Path(os.environ["RUNNER_TEMP"])/"studio"
          archive=base.parent/"Frontline-Asset-Studio-offline.zip"
          with zipfile.ZipFile(archive,"w",zipfile.ZIP_DEFLATED,compresslevel=6) as out:
              for f in sorted(base.rglob("*")):
                  if f.is_file():
                      info=zipfile.ZipInfo(f.relative_to(base).as_posix(),date_time=(2020,1,1,0,0,0))
                      info.compress_type=zipfile.ZIP_DEFLATED
                      out.writestr(info,f.read_bytes())
          with zipfile.ZipFile(archive) as bundle:
              assert bundle.testzip() is None
              assert {"index.html","studio.js","inspection.js","serve_offline.py","live_catalog.json","studio-light.hdr","vendor/three/build/three.module.js"}<=set(bundle.namelist())
          (archive.parent/(archive.name+".sha256")).write_text(hashlib.sha256(archive.read_bytes()).hexdigest()+"  "+archive.name+"\n")
          print("STUDIO_OFFLINE_ARCHIVE_PASS",archive.stat().st_size)
          PY
      - name: Smoke test the extracted offline archive
        run: |
          set -e
          mkdir "$RUNNER_TEMP/offline-check"
          python -m zipfile -e "$RUNNER_TEMP/Frontline-Asset-Studio-offline.zip" "$RUNNER_TEMP/offline-check"
          python "$RUNNER_TEMP/offline-check/serve_offline.py" --port 8766 > "$RUNNER_TEMP/offline-server.log" 2>&1 &
          server=$!
          trap 'kill "$server" || true' EXIT
          for n in $(seq 1 30); do curl -fsS http://127.0.0.1:8766/live_catalog.json >/dev/null && break; sleep 1; done
          STUDIO_URL=http://127.0.0.1:8766 node tools/asset_studio/offline_test.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: Asset-Studio-offline-${{ github.sha }}
          path: |
            ${{ runner.temp }}/Frontline-Asset-Studio-offline.zip
            ${{ runner.temp }}/Frontline-Asset-Studio-offline.zip.sha256
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Studio-QA-${{ github.sha }}
          path: |
            ${{ runner.temp }}/studio-evidence/
            ${{ runner.temp }}/studio/live_catalog.json
            ${{ runner.temp }}/studio-server.log
            ${{ runner.temp }}/godot-views/
          if-no-files-found: warn
